# THE channel config. Loaded and validated by src/config.py.
# One entry per channel. This repo hosts exactly one.

channels:
  - id: channel_4                         # unique; used in DB, logs, secret names
    tiktok_username: "lana_miniatures"    # no @  -- miniature/tiny cooking ASMR, cinematic mini kitchen. 101K followers / 727K likes. Has a small YouTube channel (@LanaMiniatures, 2.9K subs) but it's ~1yr dormant (last upload 799 views) -- low practical collision risk, verified on both platforms. Swapped in from the dead "Whisker World" AI-cat-vlog source (14 vids, max 67 views); real-cat content already covered by ch10 Cat Chaos Lab.
    youtube_channel_name: "Tiny Feast"
    owner_email: "dkdhaker0000095@gmail.com"

    google_credentials_file: "credentials/channel_4_client_secret.json"
    oauth_token_file: "tokens/channel_4_token.json"

    videos_per_day: 2
    description_footer: ""
    default_tags: [miniature cooking, tiny food, asmr cooking, mini kitchen, satisfying,
                   oddly satisfying, tiny food asmr, miniature food, asmr, cooking asmr,
                   mini food, tiny cooking, satisfying video, relaxing, cute food,
                   dollhouse cooking, small food, calming, mini chef, so satisfying]
    youtube_category_id: "26"             # 26 Howto & Style (mini-cooking / craft ASMR)
    enabled: true
    max_retry_days: 7
    shorts_max_seconds: 180
    min_video_seconds: 12                 # skip clips shorter than 12s
    max_video_seconds: 170                # keep it in Shorts range
    upload_mode: popular_only             # always pick the most-viewed unposted video
    max_download_candidates: 20

    use_ai_seo: true
    edit:
      enabled: true
      zoom_crop_pct: 3.0
      speed: 1.03
      hflip: false
      fade_seconds: 0.25
      sharpen: true
      denoise: false
      saturation: 1.07
      contrast: 1.04
      loudnorm: true
      volume_gain_db: 0.0
      blur_regions: []
      hook_caption:                    # burned-in hook, first 3s (retention + transformation)
        enabled: true
        seconds: 3
        position: top
        size_pct: 5.6
      brand_overlay:                     # small corner mark
        enabled: true
        image: "assets/brand_badge.png"
        corner: tr
        width_pct: 11
        margin_pct: 3
        opacity: 0.92

    thumbnail:
      enabled: true
      hook_source: title
      position: bottom
      accent_rgb: [240, 165, 120]
      hook_templates:
        - "SO SATISFYING"
        - "TINY BUT REAL"
        - "WATCH THIS COOK"
        - "MINI PERFECTION"

    slot_publish_times_utc:               # these ARE the cron fire times (IST = UTC + 5:30)
      1: "22:30"                          # 4:00 AM IST -- US evening scroll (6:30 PM ET)
      2: "14:30"                          # 8:00 PM IST
