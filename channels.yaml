# THE channel config. Loaded and validated by src/config.py.
# One entry per channel. This repo hosts exactly one.

channels:
  - id: channel_4                         # unique; used in DB, logs, secret names
    tiktok_username: "tailbitpets"        # no @  -- AI cat vlogs (Loki & Max)
    youtube_channel_name: "Whisker World"
    owner_email: "dkdhaker0000095@gmail.com"

    google_credentials_file: "credentials/channel_4_client_secret.json"
    oauth_token_file: "tokens/channel_4_token.json"

    videos_per_day: 1
    description_footer: ""
    default_tags: [cute animals, funny cats, cat vlog, kittens, adorable pets,
                   wholesome animals, cute cat, pets of tiktok, animal shorts,
                   funny pets, cat lover, heartwarming]
    youtube_category_id: "15"             # 15 Pets & Animals
    enabled: true
    max_retry_days: 7
    shorts_max_seconds: 180
    upload_mode: short_only               # 1/day -> newest unposted first
    max_download_candidates: 20

    use_ai_seo: true
    edit:
      enabled: true
      zoom_crop_pct: 2.0
      speed: 1.03
      hflip: false
      fade_seconds: 0.25
      sharpen: true
      denoise: false
      saturation: 1.06
      contrast: 1.04
      loudnorm: true
      volume_gain_db: 0.0
      blur_regions: []
      brand_overlay:                     # small corner mark
        enabled: true
        image: "assets/brand_badge.png"
        corner: tr
        width_pct: 11
        margin_pct: 3
        opacity: 0.92

    thumbnail:
      enabled: true
      hook_source: title
      position: bottom
      accent_rgb: [255, 138, 91]
      hook_templates:
        - "WAIT FOR IT"
        - "SO CUTE"
        - "HE DID WHAT?!"
        - "YOU'LL SMILE"

    slot_publish_times_utc:               # this IS the cron fire time
      1: "22:30"                          # 6:30 PM US Eastern (US evening prime) = 4:00 AM IST
